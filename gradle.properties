org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The app itself is plain framework Java: no AndroidX, no Kotlin, no support libs.
# This has to be true only because Robolectric's test harness loads
# androidx.test.platform.app.InstrumentationRegistry; nothing AndroidX reaches the APK, which
# is checked with dexdump after every release build.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
